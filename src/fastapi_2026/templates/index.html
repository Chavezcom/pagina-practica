<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>

    <!-- ⬇️ Así se referencia el CSS en Jinja2 -->
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
  {% if user %}
    <p>Hola, <strong>{{ user }}</strong>! | <a href="/perfil">Mi Perfil</a> | <a href="/logout">Salir</a></p>
{% else %}
    <p><a href="/login">Iniciar Sesión</a></p>
{% endif %}
<a href="/register">Registrarse</a>
<body>
  
    <div class="card">
        <h1>{{ titulo }}</h1>
        <p>{{ mensaje }}</p>
        <button class="btn">Botón de ejemplo</button>
    </div>
</body>
</html>
